# Non-secret runtime configuration.
# Secrets live in adoptimizer-secrets (see secret.example.yaml) and must never
# be committed with real values.
apiVersion: v1
kind: ConfigMap
metadata:
  name: adoptimizer-config
  namespace: adoptimizer
  labels:
    app.kubernetes.io/part-of: adoptimizer
data:
  APP__NAME: "Ad Optimizer"
  APP__ENVIRONMENT: "production"
  APP__API_V1_PREFIX: "/api/v1"
  APP__CORS_ALLOW_ORIGINS: '["https://ads.example.com"]'
  APP__TRUSTED_HOSTS: '["ads.example.com"]'
  DATABASE__URL: "postgresql+asyncpg://adoptimizer@postgres:5432/adoptimizer"
  DATABASE__POOL_SIZE: "10"
  DATABASE__MAX_OVERFLOW: "20"
  DATABASE__POOL_RECYCLE_SECONDS: "1800"
  REDIS__ENABLED: "true"
  REDIS__URL: "redis://redis:6379/0"
  REDIS__CACHE_TTL_SECONDS: "300"
  # ---- Analytical warehouse ----
  # Off by default, and flipping ENABLED alone is not enough: DATA_MODE below
  # must also be "warehouse", or reports keep coming from the primary datastore
  # while /readyz still reports clickhouse_enabled=true. The password belongs in
  # adoptimizer-secrets, not here. Set METRICS_SOURCE to "daily": it is the only
  # source with a writer, because `adoptimizer warehouse sync` mirrors daily
  # reports into campaign_daily_metrics and nothing writes ad_events.
  CLICKHOUSE__ENABLED: "false"
  CLICKHOUSE__HOST: "clickhouse"
  CLICKHOUSE__HTTP_PORT: "8123"
  CLICKHOUSE__NATIVE_PORT: "9000"
  CLICKHOUSE__DATABASE: "ad_optimizer"
  CLICKHOUSE__METRICS_SOURCE: "daily"
  SECURITY__JWT_ALGORITHM: "HS256"
  SECURITY__ACCESS_TOKEN_TTL_MINUTES: "15"
  SECURITY__REFRESH_TOKEN_TTL_DAYS: "7"
  SECURITY__REQUIRE_ACTION_APPROVAL: "true"
  SECURITY__VERIFY_SESSION_ON_REQUEST: "true"
  SECURITY__MAX_FAILED_LOGINS: "5"
  SECURITY__LOCKOUT_SECONDS: "900"
  SECURITY__PASSWORD_MIN_LENGTH: "10"
  RATE_LIMIT__ENABLED: "true"
  RATE_LIMIT__DEFAULT_REQUESTS_PER_MINUTE: "300"
  RATE_LIMIT__WRITE_REQUESTS_PER_MINUTE: "60"
  RATE_LIMIT__OPTIMIZE_RUNS_PER_HOUR: "20"
  LLM__PROVIDER: "mock"
  LLM__MODEL: "gpt-4o-mini"
  LLM__MONTHLY_BUDGET_USD: "200"
  LLM__FAIL_OPEN_TO_MOCK: "true"
  DATA_MODE: "mock"
  OPTIMIZATION__MAX_ITERATIONS: "3"
  OPTIMIZATION__USE_CONVEX_SOLVER: "true"
  OPTIMIZATION__MAX_BUDGET_CHANGE_PCT: "50"
  # ---- Scheduled metric ingestion ----
  # false on purpose. In Kubernetes the cadence belongs to the CronJob in
  # ingest-cronjob.yaml, not to a loop inside every API replica; leaving this on
  # would start one loop per replica and the schedule would die with whichever
  # pod restarted. `adoptimizer scheduler --once`, which is what the CronJob
  # runs, ignores this flag by design.
  INGEST__SCHEDULER_ENABLED: "false"
  # Real feeds only. "synthetic" manufactures numbers, so scheduling it here
  # would invent metric history that no platform ever reported - precisely the
  # failure this scheduler exists to prevent. Synthetic stays a demo path:
  # `adoptimizer ingest --source synthetic`.
  INGEST__SOURCES: '["platform"]'
  INGEST__INTERVAL_MINUTES: "360"
  # Overlap that absorbs platforms revising yesterday for days afterwards. It
  # costs one query and cannot corrupt a value: ingestion upserts one slot per
  # (campaign, creative, date) and an absent column never overwrites a number.
  INGEST__LOOKBACK_DAYS: "3"
  # How far back a missed run may reach by itself. Beyond it the tick reports
  # gap_days and names `adoptimizer ingest --start ... --end ...` rather than
  # quietly narrowing the window.
  INGEST__MAX_CATCHUP_DAYS: "14"
  # Must exceed one pass, or a slow pull is stolen mid-flight by the next one.
  # 1800s matches activeDeadlineSeconds in ingest-cronjob.yaml.
  INGEST__LEASE_TTL_SECONDS: "1800"
  # Rehearse mode: plan, pull, report what would land, write nothing.
  INGEST__DRY_RUN: "false"
  OBSERVABILITY__LOG_LEVEL: "INFO"
  OBSERVABILITY__JSON_LOGS: "true"
  OBSERVABILITY__METRICS_ENABLED: "true"
  OBSERVABILITY__SERVICE_NAME: "adoptimizer-backend"
  RUN_MIGRATIONS: "false"