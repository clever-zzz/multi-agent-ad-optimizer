# TEMPLATE ONLY - never commit a filled-in copy of this file.
#
# Real deployments should use ExternalSecrets, Sealed Secrets or SOPS. For a
# manual bootstrap:
#
#   python -c "import secrets;print(secrets.token_urlsafe(48))"
#   kubectl -n adoptimizer create secret generic adoptimizer-secrets \
#     --from-literal=SECURITY__JWT_SECRET='<generated>' \
#     --from-literal=SECURITY__BOOTSTRAP_ADMIN_PASSWORD='<generated>' \
#     --from-literal=POSTGRES_PASSWORD='<generated>' \
#     --from-literal=DATABASE__URL='postgresql+asyncpg://adoptimizer:<generated>@postgres:5432/adoptimizer'
#
# The backend refuses to start in production unless SECURITY__JWT_SECRET is at
# least 32 characters and the bootstrap password is at least 12.
apiVersion: v1
kind: Secret
metadata:
  name: adoptimizer-secrets
  namespace: adoptimizer
  labels:
    app.kubernetes.io/part-of: adoptimizer
type: Opaque
stringData:
  SECURITY__JWT_SECRET: "REPLACE_WITH_32_PLUS_RANDOM_CHARACTERS"
  SECURITY__BOOTSTRAP_ADMIN_EMAIL: "admin@adoptimizer.dev"
  SECURITY__BOOTSTRAP_ADMIN_PASSWORD: "REPLACE_WITH_STRONG_PASSWORD"
  POSTGRES_PASSWORD: "REPLACE_WITH_STRONG_PASSWORD"
  DATABASE__URL: "postgresql+asyncpg://adoptimizer:REPLACE_WITH_STRONG_PASSWORD@postgres:5432/adoptimizer"
  LLM__API_KEY: ""