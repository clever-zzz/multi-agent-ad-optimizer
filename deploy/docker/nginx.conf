# Main nginx configuration for the Ad Optimizer frontend container.
#
# The virtual host lives in nginx-default.conf.template, which the official
# nginx entrypoint renders into /etc/nginx/conf.d/default.conf with envsubst.
# Only real environment variables are substituted, so nginx's own $host / $uri
# variables are preserved.

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time urt=$upstream_response_time';

    access_log  /var/log/nginx/access.log  main;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    server_tokens      off;

    # Matches the backend's max_request_body_bytes so oversized uploads are
    # rejected at the edge with 413 rather than truncated mid-flight.
    client_max_body_size  2m;
    client_body_timeout   30s;
    client_header_timeout 15s;

    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    include /etc/nginx/conf.d/*.conf;
}